name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: pass_code

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar configuracion del PIN
        env:
          PIN: ${{ secrets.PASS_CODE }}
        run: |
          if [ -z "$PIN" ]; then
            echo "ERROR: PASS_CODE no está configurado"
            exit 1
          fi

          mkdir -p js

          printf 'window.PIN_ACCESO = "%s";\n' "$PIN" > js/pin-config.js

          echo "=== Verificando archivo generado ==="
          ls -la js/
          test -f js/pin-config.js || exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        uses: actions/deploy-pages@v4
