yaml
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: pass_code

    steps:
      # ==========================================
      # 1. Descargar el repositorio
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Generar configuracion del PIN
      # ==========================================
      - name: Generar configuracion del PIN
        env:
          PIN: ${{ secrets.PASS_CODE }}
        run: |
          if [ -z "$PIN" ]; then
            echo "ERROR: PASS_CODE no está configurado"
            exit 1
          fi

          # Asegurar que exista la carpeta
          mkdir -p js

          # Sobrescribir el archivo con el PIN
          printf 'window.PIN_ACCESO = "%s";\n' "$PIN" > js/pin-config.js

          # Verificar que el archivo exista
          if [ ! -f "js/pin-config.js" ]; then
            echo "ERROR: No se pudo crear js/pin-config.js"
            exit 1
          fi

          echo "Archivo js/pin-config.js generado correctamente"

      # ==========================================
      # 3. Verificar estructura antes del deploy
      # ==========================================
      - name: Verificar archivos
        run: |
          echo "=== Estructura del proyecto ==="
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "=== Verificando pin-config.js ==="

          if [ -f "js/pin-config.js" ]; then
            echo "OK: js/pin-config.js existe"
          else
            echo "ERROR: js/pin-config.js NO existe"
            exit 1
          fi

      # ==========================================
      # 4. Configurar GitHub Pages
      # ==========================================
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ==========================================
      # 5. Crear artifact para GitHub Pages
      # ==========================================
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # ==========================================
      # 6. Publicar en GitHub Pages
      # ==========================================
      - name: Deploy
        uses: actions/deploy-pages@v4

