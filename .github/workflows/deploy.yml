name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: pass_code

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar configuracion del PIN
        env:
          PIN: ${{ secrets.PASS_CODE }}
        run: |
          printf 'window.PIN_ACCESO = "%s";\n' "$PIN" > js/pin-config.js

      - name: Verificar que la configuracion fue generada
        run: |
          test -s js/pin-config.js
          grep -q "window.PIN_ACCESO" js/pin-config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        uses: actions/deploy-pages@v4
